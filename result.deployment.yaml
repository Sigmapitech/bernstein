apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
      name: result
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - result
              topologyKey: kubernetes.io/hostname
      containers:
        - envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
          image: epitechcontent/t-dop-600-result:k8s
          name: redis
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 250m
              memory: 128M
            requests:
              cpu: 50m
              memory: 64M
      restartPolicy: Always
