apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: poll
  labels:
    app: poll
spec:
  ingressClassName: traefik
  rules:
    - host: poll.dop.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poll
                port:
                  number: 80
