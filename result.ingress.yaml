apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: result
  name: result
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: result.dop.io
      http:
        paths:
          - backend:
              service:
                name: result
                port:
                  number: 80
            path: /
            pathType: Prefix
