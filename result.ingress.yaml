apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: result
  labels:
    app: result
spec:
  ingressClassName: traefik
  rules:
    - host: result.dop.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: 80
