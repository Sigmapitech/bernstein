apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      name: redis
      labels:
        app: redis
    spec:
      restartPolicy: Always
      containers:
        - name: redis
          image: redis:5.0
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m       # 50miliCPUCore
              memory: 256M
            limits:
              cpu: 250m
              memory: 4G
      envFrom:
        - configMapRef:
            name: redis
