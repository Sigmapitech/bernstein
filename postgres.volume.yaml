apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: postgres
  name: postgres
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 64G
  local:
    path: /var/lib/postgresql/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: postgres
  name: postgres
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64G
